<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Manrope'; src: url('./Manrope-ExtraBold.ttf') format('truetype'); font-weight: 800; }
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body><canvas id="c"></canvas>
<script>
/*
 * Act 1 of the opening: image, then text, three times.
 *
 *   each beat lasts 2.5 s:
 *     0.00  a full-screen photograph of one of the owner's builds, graded, in
 *           a cinematic letterbox, pulling back slowly while a light streak
 *           crosses it
 *     1.50  hard cut (white flash) to a single word slamming in, its letters
 *           filled with that same photograph, a brand glow behind
 *   IMAGINE (the gold-shelf stand), CREATE (Texspin), DELIVER (the DST dome)
 *
 * Driven only by time: window.renderAt(t) returns the frame at t (0..7.5 s).
 */
const Q = new URLSearchParams(location.search)
const W = +(Q.get('w') || 1920), H = +(Q.get('h') || 1080)
const PORTRAIT = H > W
const cv = document.getElementById('c'); cv.width = W; cv.height = H
const g = cv.getContext('2d')
const off = document.createElement('canvas'); off.width = W; off.height = H
const o = off.getContext('2d')
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const span = (t, a, b) => clamp((t - a) / (b - a))
const easeOut = x => 1 - Math.pow(1 - x, 4)
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2)

const BEATS = [
  { img: 'hero-imagine.png', word: 'IMAGINE', glow: '#2f55ff', fx: 0.42, fy: 0.45, dir: 1 },
  { img: 'hero-create.png', word: 'CREATE', glow: '#53B618', fx: 0.55, fy: 0.5, dir: -1 },
  { img: 'hero-deliver.png', word: 'DELIVER', glow: '#3f63ff', fx: 0.5, fy: 0.42, dir: 1 },
]
const BEAT = 2.5, IMG = 1.5

// draw an image cover-fit, scaled about a focus point
function cover(ctx, im, scale, fx, fy, dx = 0) {
  const r = Math.max(W / im.width, H / im.height) * scale
  const w = im.width * r, h = im.height * r
  const x = W / 2 - w * fx + dx, y = H / 2 - h * fy
  ctx.drawImage(im, Math.min(0, Math.max(W - w, x)), Math.min(0, Math.max(H - h, y)), w, h)
}

function photoShot(b, u) {
  // pulls back from 1.16 to 1.04 over the shot, drifting sideways
  g.save()
  g.filter = 'contrast(1.18) saturate(1.2) brightness(0.92)'
  cover(g, b.im, 1.16 - 0.12 * easeOut(u), b.fx, b.fy, b.dir * 30 * u * (PORTRAIT ? 0.5 : 1))
  g.restore()
  // grade: cool shadows, a vignette
  g.fillStyle = 'rgba(10, 20, 60, 0.18)'; g.fillRect(0, 0, W, H)
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75)
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.65)'); g.fillStyle = vg; g.fillRect(0, 0, W, H)
  // anamorphic light streak crossing the frame
  const sx = -0.3 * W + 1.6 * W * easeIO(u), sy = H * (0.38 + 0.08 * b.dir)
  g.save(); g.globalCompositeOperation = 'screen'
  const st = g.createLinearGradient(sx - W * 0.5, 0, sx + W * 0.5, 0)
  st.addColorStop(0, 'rgba(80,120,255,0)'); st.addColorStop(0.5, 'rgba(160,190,255,0.55)'); st.addColorStop(1, 'rgba(80,120,255,0)')
  g.fillStyle = st; g.fillRect(0, sy - H * 0.004, W, H * 0.008)
  const halo = g.createRadialGradient(sx, sy, 0, sx, sy, H * 0.25)
  halo.addColorStop(0, 'rgba(140,170,255,0.35)'); halo.addColorStop(1, 'rgba(140,170,255,0)'); g.fillStyle = halo; g.fillRect(0, 0, W, H)
  g.restore()
  // letterbox bars, a cinematic 2.39:1 on landscape
  if (!PORTRAIT) { const bar = (H - W / 2.39) / 2; g.fillStyle = '#000'; g.fillRect(0, 0, W, bar); g.fillRect(0, H - bar, W, bar) }
}

function wordShot(b, u) {
  // ground: black with a brand glow
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H)
  const gl = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.55)
  gl.addColorStop(0, b.glow + '55'); gl.addColorStop(0.5, b.glow + '14'); gl.addColorStop(1, 'rgba(0,0,0,0)')
  g.fillStyle = gl; g.fillRect(0, 0, W, H)
  // the word: slams in from 1.4x, then drifts to 0.96
  const slam = easeOut(span(u, 0, 0.28))
  const s = (1.4 - 0.4 * slam) * (1 - 0.04 * span(u, 0.28, 1))
  const fs = Math.min(W * (PORTRAIT ? 0.22 : 0.24), H * 0.46)
  g.save(); g.font = `800 ${fs}px Manrope`
  const tw = g.measureText(b.word).width
  g.restore()
  const fit = Math.min(1, (W * 0.86) / tw)
  const size = fs * fit
  // letters filled with the photograph
  o.clearRect(0, 0, W, H)
  o.save(); o.translate(W / 2, H / 2); o.scale(s, s); o.translate(-W / 2, -H / 2)
  o.font = `800 ${size}px Manrope`; o.textAlign = 'center'; o.textBaseline = 'middle'
  if ('letterSpacing' in o) o.letterSpacing = `${size * 0.02}px`
  o.fillStyle = '#fff'; o.fillText(b.word, W / 2, H / 2)
  o.restore()
  o.save(); o.globalCompositeOperation = 'source-in'; o.filter = 'contrast(1.25) saturate(1.3) brightness(1.35)'
  cover(o, b.im, 1.05 + 0.1 * u, b.fx, b.fy, -b.dir * 40 * u)
  o.restore()
  // glow behind, then the filled word, then a thin bright edge
  g.save(); g.shadowColor = b.glow; g.shadowBlur = size * 0.35 * (0.6 + 0.4 * slam); g.globalAlpha = 0.9; g.drawImage(off, 0, 0); g.restore()
  g.drawImage(off, 0, 0)
  g.save(); g.translate(W / 2, H / 2); g.scale(s, s); g.translate(-W / 2, -H / 2)
  g.font = `800 ${size}px Manrope`; g.textAlign = 'center'; g.textBaseline = 'middle'
  if ('letterSpacing' in g) g.letterSpacing = `${size * 0.02}px`
  g.lineWidth = Math.max(1.5, size * 0.006); g.strokeStyle = 'rgba(255,255,255,0.55)'; g.strokeText(b.word, W / 2, H / 2)
  g.restore()
  // a light sweep across the letters
  const sw = -0.2 + 1.4 * easeIO(span(u, 0.15, 0.95))
  g.save(); g.globalCompositeOperation = 'screen'
  const lg = g.createLinearGradient(W * (sw - 0.12), 0, W * (sw + 0.12), H * 0.3)
  lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.35)'); lg.addColorStop(1, 'rgba(255,255,255,0)')
  g.globalAlpha = 1; o.save(); o.globalCompositeOperation = 'source-in'; o.fillStyle = lg; o.fillRect(0, 0, W, H); o.restore()
  g.drawImage(off, 0, 0); g.restore()
}

window.renderAt = (t) => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none'
  const i = Math.min(2, Math.floor(t / BEAT)), b = BEATS[i], lt = t - i * BEAT
  if (lt < IMG) photoShot(b, lt / IMG)
  else wordShot(b, (lt - IMG) / (BEAT - IMG))
  // white flash on each cut (into the word, and into the next photograph)
  for (const c of [0, IMG]) { const d = lt - c; if (d >= 0 && d < 0.12 && !(i === 0 && c === 0)) { g.fillStyle = `rgba(255,255,255,${0.9 * (1 - d / 0.12)})`; g.fillRect(0, 0, W, H) } }
  // fade in from black at the start
  if (t < 0.5) { g.fillStyle = `rgba(0,0,0,${1 - t / 0.5})`; g.fillRect(0, 0, W, H) }
  // film grain-free fine noise would compress badly: none
  return cv.toDataURL('image/png')
}

;(async () => {
  await document.fonts.load('800 100px Manrope')
  await Promise.all(BEATS.map(b => new Promise(res => { const im = new Image(); im.onload = () => { b.im = im; res() }; im.src = './' + b.img })))
  window.ready = true
})()
</script>
</body></html>
